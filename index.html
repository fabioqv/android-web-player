<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- TELA: "maximum-scale=1" e "user-scalable=no" desligam o zoom no celular.
         Isso não afeta o zoom do computador (Ctrl + / Ctrl −).
         Para voltar a permitir zoom no celular, troque por:
         width=device-width, initial-scale=1.0, viewport-fit=cover -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <title>Meu Player</title>

    <!-- APP INSTALÁVEL: manifesto, ícones e cor da barra do sistema -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#15131f" />

    <!-- iPhone: abre em tela cheia quando instalado -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Player" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <script>
      // COMPENSAÇÃO DO ZOOM (só computador, Chrome/Edge):
      // Descobre o zoom do navegador comparando a largura da janela (outerWidth,
      // que não muda com o zoom) com a largura da página (innerWidth, que muda).
      // Se o zoom for menor que 100%, o texto base aumenta na mesma proporção
      // (variável --escala, usada no index.css) e o app mantém o tamanho aparente.
      // Para DESLIGAR essa compensação, apague este bloco inteiro <script>.
      (function () {
        var NIVEIS = [0.25, 1 / 3, 0.5, 2 / 3, 0.75, 0.8, 0.9, 1]; // zoom do Chrome/Edge
        function ajustar() {
          var escala = 1;
          var toque = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
          if (!toque && window.innerWidth > 0) {
            var z = window.outerWidth / window.innerWidth;
            if (z > 0.2 && z < 0.95) {
              var melhor = NIVEIS[0];
              NIVEIS.forEach(function (n) {
                if (Math.abs(n - z) < Math.abs(melhor - z)) melhor = n;
              });
              escala = 1 / melhor;
            }
          }
          document.documentElement.style.setProperty('--escala', String(escala));
        }
        ajustar();
        window.addEventListener('resize', ajustar);
      })();
    </script>
  </head>
  <body>
    <!-- Aqui o React desenha o app -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // FUNCIONAMENTO SEM INTERNET: registra o arquivo sw.js
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }

      // iPHONE: o Safari ignora o "user-scalable=no", então a pinça é bloqueada aqui.
      // Só vale em telas de toque, para não atrapalhar o trackpad do Mac.
      if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (nome) {
          document.addEventListener(nome, function (e) { e.preventDefault(); });
        });
      }
    </script>
  </body>
</html>
